<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>NewsCryst - Latest News & Headlines | Stay Informed Daily</title>
    <meta name="description" content="NewsCryst brings you the latest news from around the world. Browse trending headlines, search topics, and save your favorite articles. Fast, modern news aggregator powered by NewsAPI." />
    <meta name="keywords" content="news, headlines, current events, news aggregator, trending news, world news, technology news, entertainment news, sports news, business news" />
    <meta name="author" content="Tajamul Wani" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph Meta Tags (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NewsCryst - Latest News & Headlines" />
    <meta property="og:description" content="Stay updated with the latest news from around the world. Browse, search, and save your favorite articles." />
    <meta property="og:url" content="https://newscryst.netlify.app" />
    <meta property="og:site_name" content="NewsCryst" />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NewsCryst - Latest News & Headlines" />
    <meta name="twitter:description" content="Stay updated with the latest news from around the world." />
    <meta name="twitter:image" content="/favicon.svg" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#0d6efd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://newscryst.netlify.app/Newscryst/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
