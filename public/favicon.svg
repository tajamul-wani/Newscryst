<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#0d6efd" rx="6"/>
  
  <!-- Newspaper symbol -->
  <g fill="white">
    <!-- Left column (headline) -->
    <rect x="4" y="6" width="10" height="3" rx="1"/>
    <rect x="4" y="11" width="10" height="2" rx="1" opacity="0.8"/>
    <rect x="4" y="15" width="10" height="2" rx="1" opacity="0.8"/>
    <rect x="4" y="19" width="10" height="2" rx="1" opacity="0.8"/>
    
    <!-- Right column -->
    <rect x="16" y="6" width="12" height="3" rx="1"/>
    <rect x="16" y="11" width="12" height="2" rx="1" opacity="0.8"/>
    <rect x="16" y="15" width="12" height="2" rx="1" opacity="0.8"/>
    <rect x="16" y="19" width="12" height="2" rx="1" opacity="0.8"/>
    
    <!-- Crystal accent -->
    <polygon points="16,24 20,27 16,30 12,27" opacity="0.9"/>
  </g>
</svg>
