<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0d6efd" opacity="0.1" stroke="#0d6efd" stroke-width="2"/>
  
  <!-- Newspaper fold effect -->
  <g>
    <!-- Left page -->
    <path d="M 50 60 L 90 60 L 90 140 L 50 140 Z" fill="#ffffff" stroke="#0d6efd" stroke-width="1.5"/>
    
    <!-- Right page (overlapping) -->
    <path d="M 85 50 L 135 50 L 135 135 L 85 135 Z" fill="#0d6efd" opacity="0.9" stroke="#0d6efd" stroke-width="1.5"/>
    
    <!-- Text lines on left page -->
    <line x1="58" y1="75" x2="82" y2="75" stroke="#0d6efd" stroke-width="1.5" opacity="0.7"/>
    <line x1="58" y1="85" x2="82" y2="85" stroke="#0d6efd" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="93" x2="82" y2="93" stroke="#0d6efd" stroke-width="1" opacity="0.5"/>
    
    <!-- Text lines on right page -->
    <line x1="93" y1="65" x2="127" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="93" y1="76" x2="127" y2="76" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="93" y1="85" x2="127" y2="85" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Crystal/gem shape at bottom -->
  <g transform="translate(100, 155)">
    <polygon points="0,-8 6,-2 4,6 -4,6 -6,-2" fill="#0d6efd" opacity="0.8"/>
    <polygon points="0,-8 -6,-2 -4,6 4,6 6,-2" fill="#0d6efd" opacity="0.6"/>
  </g>
</svg>
